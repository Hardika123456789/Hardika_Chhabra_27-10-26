<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopsy - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h1>Shopsy</h1>
        <a href="#cart">My Cart (<span id="cart-count">0</span>)</a>
    </header>

    <main class="container">
        <h2>Explore Products</h2>

        <section class="filters">
            <input type="search" id="search-input" placeholder="Search products">
            <button type="button" id="search-button">Search</button>

            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Accessories">Accessories</option>
            </select>

            <select id="sort-filter">
                <option value="default">Sort By</option>
                <option value="low-high">Price: Low to High</option>
                <option value="high-low">Price: High to Low</option>
            </select>
        </section>

        <section id="product-list" class="product-grid"></section>

        <section id="cart" class="cart-section">
            <h2>Your Shopping Cart</h2>

            <div id="cart-items">
                <p class="empty-message">Your cart is empty.</p>
            </div>

            <div class="summary">
                <p>Subtotal: <span id="subtotal">0.00</span></p>
                <p>Discount: <span id="discount">0.00</span></p>
                <h3>Total: <span id="total">0.00</span></h3>
            </div>

            <div class="coupon-box">
                <input type="text" id="coupon-input"
                       placeholder="Enter coupon code">
                <button id="apply-coupon">Apply Coupon</button>
                <p id="coupon-message"></p>
            </div>

            <button id="checkout-btn" class="checkout-btn">
                Proceed to Checkout
            </button>
        </section>

        <section id="checkout-section" class="checkout-section hidden">
            <h2>Checkout</h2>

            <form id="checkout-form">
                <label for="customer-name">Full Name</label>
                <input type="text" id="customer-name" required>

                <label for="customer-email">Email</label>
                <input type="email" id="customer-email" required>

                <label for="customer-address">Delivery Address</label>
                <textarea id="customer-address" rows="3" required></textarea>

                <h3>Order Total: <span id="checkout-total">0.00</span></h3>

                <button type="submit" class="checkout-btn">
                    Place Order
                </button>
            </form>

            <p id="order-message"></p>
        </section>
    </main>

    <footer>
        <p>2026 Shopsy | Shopping Website</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const removeUndefinedText = (root) => {
            const walker = document.createTreeWalker(
                root, NodeFilter.SHOW_TEXT
            );
            let node;

            while ((node = walker.nextNode())) {
                if (node.nodeValue.includes("undefined")) {
                    node.nodeValue =
                        node.nodeValue.replace(/undefined/g, "");
                }
            }
        };

        removeUndefinedText(document.body);

        new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                mutation.addedNodes.forEach((node) => {
                    if (node.nodeType === Node.TEXT_NODE) {
                        if (node.nodeValue.includes("undefined")) {
                            node.nodeValue =
                                node.nodeValue.replace(/undefined/g, "");
                        }
                    } else if (node.nodeType === Node.ELEMENT_NODE) {
                        removeUndefinedText(node);
                    }
                });
            });
        }).observe(document.body, {
            childList: true,
            subtree: true
        });
    </script>
</body>
</html>
